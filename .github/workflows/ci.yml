name: ci

# CI is `make verify`: what passes on a laptop passes here, and a step added
# to one is added to the other. A pull request also meets the gates, which
# read its title, body and labels (docs/decisions/0006).
on:
  pull_request:
    # labeled/unlabeled: the guardrails gate reads the labels.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Where CI runs locally (the repository variable CI_MODE=local: a private
  # repository on a free plan, where these minutes are paid for), make proof
  # runs this job on a laptop, with the reviewer agent, and the gates job
  # checks its record instead (ADR 0015). It still runs when dispatched (the
  # owner's check of a record) and on Dependabot's pull requests, which no
  # laptop verifies.
  verify:
    if: vars.CI_MODE != 'local' || github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make verify

  # The pull request's own text reaches the gates through env only, never the shell.
  gates:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run ./tools/gates evidence && go run ./tools/gates guardrails
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_ACTOR: ${{ github.event.pull_request.user.login }}
      # The verify job's stand-in where CI runs locally: make proof's record
      # is a green, reviewed run of the head's tree (tools/proof).
      - if: vars.CI_MODE == 'local' && github.event.pull_request.user.login != 'dependabot[bot]'
        run: go run ./tools/proof check --ref ${{ github.event.pull_request.head.sha }}
